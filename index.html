<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기관투자자 미팅 결과 보고서</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { 
            font-family: 'Pretendard', sans-serif; 
            /* 한글 단어 끊김 방지 */
            word-break: keep-all; 
        }
        @media print {
            body { background-color: white; -webkit-print-color-adjust: exact; }
            .print-shadow-none { box-shadow: none !important; }
            .print-bg-white { background-color: white !important; }
            .page-break-avoid { page-break-inside: avoid; }
            .print-hidden { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 py-8 px-4 sm:px-8 break-keep">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // 아이콘 컴포넌트
        const Edit2Icon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
        );
        const SaveIcon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        );
        const PrinterIcon = ({ size = 16 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
        );
        const PlusIcon = ({ size = 14 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        );
        const Trash2Icon = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );

        function App() {
            const [isEditing, setIsEditing] = useState(false);

            const [reportData, setReportData] = useState({
                date: "2026년 5월 14일",
                author: "공시IR팀 이성태 차장",
                meetingDate: "2026.05.14(목) 14:00",
                method: "기업탐방",
                institution: "그로쓰리서치",
                institutionNote: "※ 당사 보고서 발간 이력 있는 독립리서치",
                attendeesInst: "김주형 수석연구원, 김민찬 연구원, 이승혁 책임",
                attendeesCorp: "김인환 이사, 이성태 차장",
                qna: [
                    {
                        id: 1,
                        title: "당사 전체적인 소개 및 사업 개관",
                        question: "김주형 수석연구원을 제외한 다른 참석자들의 경우 당사 미팅이 처음이므로, 회사 전체적인 사업 개관 및 히스토리에 대한 설명 요청",
                        answer: "당사는 언어처리기술을 기반으로 기업용 검색엔진으로 시작해, 빅데이터, 챗봇을 거쳐 현재 AI 에이전트 솔루션을 공급하는 업체로 진화했음을 설명함.\n특히 검색 및 챗봇의 경우 공공영역 점유율 1위를 굳건히 고수하고 있으며, 이를 바탕으로 AI 에이전트 영역에서도 적극적으로 시장을 확대하고 있음을 강조함."
                    },
                    {
                        id: 2,
                        title: "AI 에이전트 솔루션 라인업 및 기술 경쟁력 (RAG, LLM)",
                        question: "[Q1] 최근 화두인 RAG(검색 증강 생성)의 개념에 대한 구체적인 설명 요청\n[Q2] 당사 자체 LLM이 존재하는데, 외부 타사 LLM을 이용하여 솔루션을 구축하는 것도 가능한지?\n[Q3] 외산 대형 LLM 서비스들도 'AI 에이전트'를 표방하고 있는데, 당사 B2B 솔루션만의 핵심 경쟁력은 무엇인지?",
                        answer: "[A1] RAG는 LLM의 환각(Hallucination)을 방지하기 위해 기업 내부의 신뢰할 수 있는 데이터를 먼저 '검색'한 후, 이를 바탕으로 답변을 '생성'하는 기술임을 설명. 당사의 'WISE iRAG'는 25년간 축적된 검색 기술(키워드+벡터 하이브리드 검색)을 결합하여 높은 정확도와 보안성을 제공하는 구축형 Agent임을 강조함.\n\n[A2] 가능함. 당사는 한국어 및 도메인에 특화된 자체 모델 'WISE LLOA'를 보유하고 있으나, 당사의 통합 AI 플랫폼(WISE Agent Sphere)은 유연성을 갖추고 있어 오픈AI, 네이버 등 고객사가 원하는 다양한 외부 대형 LLM과 연동하여 구축 가능함을 어필함.\n\n[A3] 외산 대형 LLM은 웹 지식 기반의 '범용 대화 및 창의성'에 중심을 둔 B2C 성격이 강한 반면, 당사는 철저한 '도메인 최적화(산업별 일관성)'와 '내부 데이터 기반 정밀 지식 처리'에 특화된 B2B/B2G 에이전트임. 단순 대화를 넘어 고객사 내부망(포털, 업무시스템 등)과 완벽히 연동되고, RPA 등과 결합해 실제 업무 프로세스를 자동 실행하는 것이 가장 큰 차별화 포인트임을 설명함."
                    },
                    {
                        id: 3,
                        title: "2026년 실적 전망 및 수익성 전략",
                        question: "올해(2026년) 실적 가이던스 및 신사업(AI 에이전트)의 마진율, 기존 사업과의 카니발리제이션 우려는 없는지?",
                        answer: "• 2026년 실적 전망: 지연되었던 공공기관의 예산 집행이 올해 집중되고 있으며, 특히 대부분의 발주가 '생성형 AI' 관련 사업으로 나오고 있어 수주 환경이 매우 긍정적임.\n• 카니발리제이션: 기존 레거시(검색/챗봇) 사업에 대한 일부 카니발리제이션은 존재함. 다만, AI 에이전트 사업의 단위 규모가 훨씬 크기 때문에 해당 사업 수주 시 전체 외형(Top-line) 성장에는 확실한 플러스 요인으로 작용함.\n• 마진율 및 사업 기조: AI 에이전트는 당장의 마진보다는 초기 시장 점유율 1위 선점과 핵심 레퍼런스 확보를 최우선 목표로 함. 기존 사업과 안정적인 유지보수에서 수익성(마진율)을 방어하고, 신사업은 공격적으로 확장하는 투트랙 기조로 운영 중임."
                    },
                    {
                        id: 4,
                        title: "파트너십(퓨리오사AI) 및 타겟 시장 확대 전략",
                        question: "최근 AI 반도체 기업 퓨리오사AI와의 협업 현황과 더불어 향후 핵심 타겟 시장(도메인) 진출 전략은 어떻게 되는지?",
                        answer: "당사의 AI 소프트웨어 역량(WISE iRAG, WISE LLOA)과 퓨리오사AI의 2세대 NPU(레니게이드)를 결합하는 하드웨어 협업을 긴밀히 진행 중임. 실제로 최근(4월 2일) 퓨리오사AI 주최 '레니게이드 2026 서밋' 행사에 핵심 파트너로 참가하여, 전원과 네트워크만 연결하면 폐쇄망 환경에서도 즉시 구동 가능한 '일체형 AI 어플라이언스'를 공개 및 시연하여 큰 호응을 얻었음.\n\n이를 무기로 보안과 온프레미스(구축형) 수요가 높은 '공공기관'을 최우선적으로 타겟팅하여 시장을 선점할 계획임. 선제적으로 확보된 강력한 공공 레퍼런스를 바탕으로, 당사가 기존부터 확고한 강점 및 레퍼런스를 보유하고 있는 '금융 분야'로 도메인을 집중 확장해 나간다는 전략을 피력함."
                    },
                    {
                        id: 5,
                        title: "주주환원 및 배당 정책 (기업가치 제고)",
                        question: "당사의 배당 등 향후 주주환원 정책은 어떻게 되는지?",
                        answer: "기 공시된 '기업가치 제고 계획'과 동일하게 답변함. 당사는 2025년 결산 기준 배당성향 63.51%(약 11.1억 원)로 전년 대비 현금 배당을 대폭 확대(29.17% 증가)하였음.\n향후에도 매년 연결 당기순이익의 40% 이상 배당 성향을 유지하고, 실적 성장세에 맞추어 배당 규모를 우상향시켜 AI 에이전트 R&D 투자와 주주환원의 최적 자본 배치를 이어나갈 것임을 강조함."
                    }
                ],
                sentiment: "중립적",
                sentimentComments: [
                    "과거 당사 리서치 보고서를 작성한 경험이 있어, 기본적으로 회사 전반에 대해 긍정적인 시각을 보유하고 있음.",
                    "당사가 새롭게 영위하고자 하는 AI 에이전트 사업 영역 및 그동안의 실적 결과에 대해서는 긍정적으로 평가함.",
                    "다만, 시장 내 타사(Peer Group) 대비 당사만이 갖는 직접적이고 차별화된 경쟁 요인 어필이 추가로 필요해 보인다는 의견을 제시함."
                ],
                actionItems: [
                    {
                        id: 1,
                        category: "업계 네트워킹 및 향후 IR 계획 (Follow-up)",
                        content: "해당 기관은 독립리서치 중에서도 업계 내 가장 많은 PB 네트워크를 보유하고 있음.\n향후 여의도 방문 시 당사 IR담당자와 주요 PB들 간의 별도 미팅 자리를 마련해주기로 약속함. (적극적인 후속 미팅 추진 및 스케줄링 요망)"
                    }
                ]
            });

            const handleChange = (field, value) => {
                setReportData(prev => ({ ...prev, [field]: value }));
            };

            const handleQnaChange = (id, field, value) => {
                setReportData(prev => ({
                    ...prev,
                    qna: prev.qna.map(item => item.id === id ? { ...item, [field]: value } : item)
                }));
            };

            const addQna = () => {
                const newId = reportData.qna.length > 0 ? Math.max(...reportData.qna.map(q => q.id)) + 1 : 1;
                setReportData(prev => ({
                    ...prev,
                    qna: [...prev.qna, { id: newId, title: "", question: "", answer: "" }]
                }));
            };

            const removeQna = (id) => {
                setReportData(prev => ({
                    ...prev,
                    qna: prev.qna.filter(item => item.id !== id)
                }));
            };

            const handleSentimentCommentChange = (index, value) => {
                const newComments = [...reportData.sentimentComments];
                newComments[index] = value;
                setReportData(prev => ({ ...prev, sentimentComments: newComments }));
            };

            const addSentimentComment = () => {
                setReportData(prev => ({ ...prev, sentimentComments: [...prev.sentimentComments, ""] }));
            };

            const removeSentimentComment = (index) => {
                const newComments = [...reportData.sentimentComments];
                newComments.splice(index, 1);
                setReportData(prev => ({ ...prev, sentimentComments: newComments }));
            };

            const handleActionItemChange = (id, field, value) => {
                setReportData(prev => ({
                    ...prev,
                    actionItems: prev.actionItems.map(item => item.id === id ? { ...item, [field]: value } : item)
                }));
            };

            const addActionItem = () => {
                const newId = reportData.actionItems.length > 0 ? Math.max(...reportData.actionItems.map(a => a.id)) + 1 : 1;
                setReportData(prev => ({
                    ...prev,
                    actionItems: [...prev.actionItems, { id: newId, category: "", content: "" }]
                }));
            };

            const removeActionItem = (id) => {
                setReportData(prev => ({
                    ...prev,
                    actionItems: prev.actionItems.filter(item => item.id !== id)
                }));
            };

            const handlePrint = () => {
                window.print();
            };

            const inputClass = "w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all";
            const textareaClass = "w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-y min-h-[80px]";

            return (
                <div className="font-sans">
                    <div className="fixed top-4 right-4 sm:top-8 sm:right-8 flex gap-2 z-50 print-hidden shadow-xl rounded-full bg-white p-2 border border-gray-200">
                        <button
                            onClick={() => setIsEditing(!isEditing)}
                            className={`flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm transition-colors ${isEditing ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                        >
                            {isEditing ? <><SaveIcon size={16} /> 저장 및 미리보기</> : <><Edit2Icon size={16} /> 수정 모드</>}
                        </button>
                        <button
                            onClick={handlePrint}
                            className="flex items-center gap-2 px-4 py-2 rounded-full font-bold text-sm bg-slate-800 text-white hover:bg-slate-900 transition-colors"
                        >
                            <PrinterIcon size={16} /> PDF 인쇄
                        </button>
                    </div>

                    <div className={`max-w-4xl mx-auto bg-white rounded-xl shadow-lg print-shadow-none p-8 sm:p-12 border ${isEditing ? 'border-blue-400 ring-4 ring-blue-50' : 'border-gray-200'} transition-all duration-300`}>
                        <header className="flex flex-col sm:flex-row justify-between items-start sm:items-end border-b-2 border-slate-800 pb-6 mb-8">
                            <div>
                                <h1 className="text-3xl font-bold text-slate-900 tracking-tight">
                                    기관투자자 미팅 결과 보고서
                                </h1>
                            </div>
                            <div className="mt-4 sm:mt-0 text-sm text-right flex flex-col gap-2">
                                <div className="flex items-center justify-end gap-2">
                                    <span className="font-semibold text-gray-600">작성일:</span>
                                    {isEditing ? (
                                        <input type="text" className={`${inputClass} w-32 py-1 text-center`} value={reportData.date} onChange={e => handleChange('date', e.target.value)} />
                                    ) : (
                                        <span className="text-gray-900 border-b border-gray-300 pb-0.5 px-1 min-w-[120px] inline-block text-center">{reportData.date}</span>
                                    )}
                                </div>
                                <div className="flex items-center justify-end gap-2">
                                    <span className="font-semibold text-gray-600">작성자:</span>
                                    {isEditing ? (
                                        <input type="text" className={`${inputClass} w-40 py-1 text-center`} value={reportData.author} onChange={e => handleChange('author', e.target.value)} />
                                    ) : (
                                        <span className="text-gray-900 border-b border-gray-300 pb-0.5 px-1 min-w-[120px] inline-block text-center">{reportData.author}</span>
                                    )}
                                </div>
                            </div>
                        </header>

                        <section className="mb-8 page-break-avoid">
                            <h2 className="text-lg font-bold text-blue-800 flex items-center gap-2 mb-3">
                                <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-sm">1</span> 미팅 개요
                            </h2>
                            <div className="bg-slate-50 p-5 rounded-lg border border-slate-200 grid grid-cols-1 md:grid-cols-2 gap-y-4 gap-x-6 text-sm">
                                <div className="flex items-start gap-3">
                                    <span className={`font-bold text-slate-700 w-[70px] shrink-0 ${isEditing ? 'mt-2' : ''}`}>일 시</span>
                                    {isEditing ? <input type="text" className={inputClass} value={reportData.meetingDate} onChange={e => handleChange('meetingDate', e.target.value)} /> : <span className="text-slate-900 leading-relaxed">{reportData.meetingDate}</span>}
                                </div>
                                <div className="flex items-start gap-3">
                                    <span className={`font-bold text-slate-700 w-[70px] shrink-0 ${isEditing ? 'mt-2' : ''}`}>방 식</span>
                                    {isEditing ? <input type="text" className={inputClass} value={reportData.method} onChange={e => handleChange('method', e.target.value)} /> : <span className="text-slate-900 leading-relaxed">{reportData.method}</span>}
                                </div>
                                <div className="flex items-start gap-3">
                                    <span className={`font-bold text-slate-700 w-[70px] shrink-0 ${isEditing ? 'mt-2' : ''}`}>기 관 명</span>
                                    {isEditing ? (
                                        <div className="flex-1 space-y-2">
                                            <input type="text" className={inputClass} placeholder="기관명" value={reportData.institution} onChange={e => handleChange('institution', e.target.value)} />
                                            <input type="text" className={`${inputClass} text-xs text-blue-600`} placeholder="특이사항 (선택)" value={reportData.institutionNote} onChange={e => handleChange('institutionNote', e.target.value)} />
                                        </div>
                                    ) : (
                                        <div className="flex flex-col">
                                            <span className="text-slate-900 font-medium leading-relaxed">{reportData.institution}</span>
                                            {reportData.institutionNote && <span className="text-xs font-normal text-blue-600">({reportData.institutionNote})</span>}
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-start gap-3">
                                    <span className={`font-bold text-slate-700 w-[70px] shrink-0 ${isEditing ? 'mt-2' : ''}`}>참석자<br/>(기관)</span>
                                    {isEditing ? <textarea className={textareaClass} value={reportData.attendeesInst} onChange={e => handleChange('attendeesInst', e.target.value)} /> : <span className="text-slate-900 whitespace-pre-wrap leading-relaxed">{reportData.attendeesInst}</span>}
                                </div>
                                <div className="flex items-start gap-3 md:col-span-2">
                                    <span className={`font-bold text-slate-700 w-[70px] shrink-0 ${isEditing ? 'mt-2' : ''}`}>참석자<br/>(당사)</span>
                                    {isEditing ? <input type="text" className={inputClass} value={reportData.attendeesCorp} onChange={e => handleChange('attendeesCorp', e.target.value)} /> : <span className="text-slate-900 leading-relaxed">{reportData.attendeesCorp}</span>}
                                </div>
                            </div>
                        </section>

                        <section className="mb-8">
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-lg font-bold text-blue-800 flex items-center gap-2">
                                    <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-sm">2</span> 주요 논의 내용 (Q&A 요약)
                                </h2>
                                {isEditing && (
                                    <button onClick={addQna} className="flex items-center gap-1 text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 transition-colors">
                                        <PlusIcon size={14} /> 주제 추가
                                    </button>
                                )}
                            </div>
                            
                            <div className="space-y-4">
                                {reportData.qna.map((item, index) => (
                                    <div key={item.id} className={`border ${isEditing ? 'border-blue-200 bg-blue-50/30' : 'border-gray-200'} rounded-lg p-5 page-break-avoid relative group`}>
                                        {isEditing && (
                                            <button onClick={() => removeQna(item.id)} className="absolute top-4 right-4 text-red-400 hover:text-red-600 transition-colors">
                                                <Trash2Icon size={18} />
                                            </button>
                                        )}
                                        {isEditing ? (
                                            <div className="space-y-3 pr-8">
                                                <div>
                                                    <label className="block text-xs font-bold text-gray-500 mb-1">주제 (Title)</label>
                                                    <input type="text" className={`${inputClass} font-bold text-slate-800`} value={item.title} onChange={e => handleQnaChange(item.id, 'title', e.target.value)} placeholder="주제를 입력하세요" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-blue-600 mb-1">질문 (Question)</label>
                                                    <textarea className={textareaClass} value={item.question} onChange={e => handleQnaChange(item.id, 'question', e.target.value)} placeholder="투자자 질문 요약" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-red-500 mb-1">답변 (Answer)</label>
                                                    <textarea className={`${textareaClass} min-h-[120px]`} value={item.answer} onChange={e => handleQnaChange(item.id, 'answer', e.target.value)} placeholder="당사 답변 요약" />
                                                </div>
                                            </div>
                                        ) : (
                                            <>
                                                <h3 className="font-bold text-slate-800 mb-4 border-b border-gray-100 pb-2">[주제 {index + 1}] {item.title}</h3>
                                                <div className="space-y-4 text-sm">
                                                    <div className="flex items-start gap-3">
                                                        <span className="font-black text-blue-600 text-base shrink-0 leading-relaxed">Q.</span>
                                                        <p className="text-slate-800 whitespace-pre-wrap leading-relaxed">{item.question}</p>
                                                    </div>
                                                    <div className="flex items-start gap-3 bg-blue-50/50 p-4 rounded-md">
                                                        <span className="font-black text-red-500 text-base shrink-0 leading-relaxed">A.</span>
                                                        <p className="text-slate-800 whitespace-pre-wrap leading-relaxed">{item.answer}</p>
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="mb-8 page-break-avoid">
                            <h2 className="text-lg font-bold text-blue-800 flex items-center gap-2 mb-3">
                                <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-sm">3</span> 기관 반응 및 분위기 (Sentiment)
                            </h2>
                            <div className={`bg-white border ${isEditing ? 'border-blue-200 bg-blue-50/30' : 'border-gray-200'} rounded-lg p-5`}>
                                <div className="flex flex-col sm:flex-row sm:items-center gap-4 mb-4">
                                    <span className="font-bold text-slate-700 text-sm">종합 분위기 :</span>
                                    {isEditing ? (
                                        <select className={`${inputClass} w-auto py-1`} value={reportData.sentiment} onChange={e => handleChange('sentiment', e.target.value)}>
                                            <option value="긍정적">긍정적</option>
                                            <option value="중립적">중립적</option>
                                            <option value="보수적">보수적</option>
                                            <option value="부정적">부정적</option>
                                        </select>
                                    ) : (
                                        <div className="flex gap-2">
                                            {['긍정적', '중립적', '보수적'].map(st => (
                                                <span key={st} className={`px-3 py-1 text-sm rounded-full border ${reportData.sentiment === st ? 'border-blue-400 text-blue-800 bg-blue-50 font-bold shadow-sm' : 'border-gray-300 text-gray-500 bg-gray-50'}`}>
                                                    {st}
                                                </span>
                                            ))}
                                            {!['긍정적', '중립적', '보수적'].includes(reportData.sentiment) && (
                                                <span className="px-3 py-1 text-sm rounded-full border border-blue-400 text-blue-800 bg-blue-50 font-bold shadow-sm">{reportData.sentiment}</span>
                                            )}
                                        </div>
                                    )}
                                </div>
                                
                                {isEditing ? (
                                    <div className="space-y-2">
                                        <label className="block text-xs font-bold text-gray-500 mb-1">세부 코멘트</label>
                                        {reportData.sentimentComments.map((comment, idx) => (
                                            <div key={idx} className="flex gap-2 items-start">
                                                <span className="mt-2 text-blue-500 text-lg leading-none">•</span>
                                                <textarea className={textareaClass} value={comment} onChange={e => handleSentimentCommentChange(idx, e.target.value)} />
                                                <button onClick={() => removeSentimentComment(idx)} className="mt-2 text-red-400 hover:text-red-600"><Trash2Icon size={18}/></button>
                                            </div>
                                        ))}
                                        <button onClick={addSentimentComment} className="flex items-center gap-1 text-sm text-blue-600 mt-2 hover:underline">
                                            <PlusIcon size={14} /> 코멘트 추가
                                        </button>
                                    </div>
                                ) : (
                                    <ul className="list-disc list-outside ml-5 space-y-2 text-sm text-slate-800 marker:text-blue-500">
                                        {reportData.sentimentComments.map((comment, idx) => (
                                            <li key={idx} className="whitespace-pre-wrap leading-relaxed">{comment}</li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                        </section>

                        <section className="page-break-avoid">
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-lg font-bold text-blue-800 flex items-center gap-2">
                                    <span className="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-sm">4</span> 특이사항 및 향후 계획 (Action Item)
                                </h2>
                                {isEditing && (
                                    <button onClick={addActionItem} className="flex items-center gap-1 text-sm bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 transition-colors">
                                        <PlusIcon size={14} /> 항목 추가
                                    </button>
                                )}
                            </div>
                            <div className={`border ${isEditing ? 'border-red-200 bg-red-50/50' : 'bg-red-50/50 border-red-100'} rounded-lg p-5`}>
                                <ul className="space-y-4 text-sm text-slate-800">
                                    {reportData.actionItems.map((item) => (
                                        <li key={item.id} className="flex flex-col sm:flex-row items-start gap-2 relative">
                                            {isEditing ? (
                                                <div className="w-full flex gap-2 items-start pr-8">
                                                    <div className="w-1/3 shrink-0">
                                                        <label className="block text-xs font-bold text-gray-500 mb-1">구분</label>
                                                        <input type="text" className={`${inputClass} font-bold text-slate-900`} value={item.category} onChange={e => handleActionItemChange(item.id, 'category', e.target.value)} placeholder="예: Follow-up 사항" />
                                                    </div>
                                                    <div className="flex-1">
                                                        <label className="block text-xs font-bold text-gray-500 mb-1">내용</label>
                                                        <textarea className={textareaClass} value={item.content} onChange={e => handleActionItemChange(item.id, 'content', e.target.value)} placeholder="내용을 입력하세요" />
                                                    </div>
                                                    <button onClick={() => removeActionItem(item.id)} className="absolute right-0 top-6 text-red-400 hover:text-red-600">
                                                        <Trash2Icon size={18} />
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="w-full">
                                                    <span className="font-bold text-slate-900 block mb-1">{item.category}</span>
                                                    <span className="text-gray-700 whitespace-pre-wrap leading-relaxed">{item.content}</span>
                                                </div>
                                            )}
                                        </li>
                                    ))}
                                    {reportData.actionItems.length === 0 && !isEditing && (
                                        <li className="text-gray-500 italic leading-relaxed">특이사항 없음</li>
                                    )}
                                </ul>
                            </div>
                        </section>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
